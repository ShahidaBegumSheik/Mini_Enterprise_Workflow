name: ecwf

services:
  mysql:
    image: mysql:8.4
    container_name: ecwf-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: wtp_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
    container_name: ecwf-notification-service
    environment:
      # Shared with the backend service; keep in sync anywhere it is set.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-ecwf-local-internal-2026}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      APP_NAME: ECWF Notification Service
      APP_VERSION: 1.0.0
      DEBUG: "false"
    ports:
      - "8004:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: ecwf-backend
    environment:
      # Service-name networking: mysql / notification-service are Docker hostnames.
      DATABASE_URL: mysql+pymysql://root:root123@mysql:3306/wtp_db
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-ecwf-local-internal-2026}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-secret-key}
      JWT_ALGORITHM: HS256
      APP_NAME: ECWF Tool
      APP_VERSION: 1.0.0
      DEBUG: "false"
    depends_on:
      mysql:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  mysql_data: