  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      authentication-service:
        condition: service_healthy
    restart: unless-stopped

