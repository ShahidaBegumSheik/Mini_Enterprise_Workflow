events {}

http {
    server {
        listen 80;
        client_max_body_size 20m;

        # ==========================================
        # Authentication Service
        # Gateway: /api/v1/auth/*
        # Service: /api/v1/auth/*
        # ==========================================
        location /api/v1/auth/ {
            proxy_pass http://authentication-service:8011;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # User Service
        # Gateway: /api/v1/users/*
        # Service: /api/v1/*
        # ==========================================
        location /api/v1/users/ {
            proxy_pass http://user-service:8002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # Individual Dashboard
        # ==========================================
        location /api/v1/dashboard/individual {
            proxy_pass http://user-service:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # Tenant Admin Service
        # Gateway: /api/v1/organizations/*
        # Service: /api/v1/organizations/*
        # ==========================================
        location /api/v1/organizations/ {
            proxy_pass http://tenant-admin-service:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # Organization Dashboard
        # ==========================================
        location /api/v1/dashboard/organization {
            proxy_pass http://tenant-admin-service:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}